background_opacity          1
cursor_trail                1
window_padding_width        25
# Send a notification when a command takes more than 5 seconds in an unfocused window
notify_on_cmd_finish unfocused

# Use theme
include themes/Celestial.conf

# Use the regular version of nerdfont symbols instead of the mono one, bcz the mono one is too small
symbol_map U+e000-U+f8ff,U+f0000-U+ffffd,U+100000-U+10fffd Symbols Nerd Font
